<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>לוטו ישראל – מחולל מספרים חכם</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh}
body{font-family:'Heebo',sans-serif;background:#f0f4f8;color:#1a1a1a;direction:rtl}

.skip-link{position:absolute;top:-100px;right:0;background:#c8102e;color:#fff;padding:10px 18px;font-size:14px;font-weight:700;z-index:9999;text-decoration:none;transition:top .2s;border-radius:0 0 8px 0}
.skip-link:focus{top:0}
:focus-visible{outline:3px solid #c8102e;outline-offset:3px;border-radius:4px}

.page{display:flex;flex-direction:column;min-height:100vh}
.content{flex:1;width:100%;max-width:540px;margin:0 auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}

/* ── Header ── */
.site-header{background:linear-gradient(135deg,#1a3fa0 0%,#2e6dd4 100%);padding:0;position:relative;overflow:hidden}
.header-inner{display:flex;align-items:center;justify-content:center;padding:14px 20px 10px;gap:10px}
.logo-ball{width:52px;height:52px;background:radial-gradient(circle at 38% 35%,#ff6b6b,#c8102e 55%,#8b0000);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);flex-shrink:0}
.logo-ball span{font-size:24px}
.logo-right{display:flex;flex-direction:column;align-items:flex-start}
.logo-title{font-size:clamp(26px,6vw,36px);font-weight:900;color:#fff;line-height:1;letter-spacing:-1px}
.logo-title em{color:#f5c518;font-style:normal}
.logo-sub{font-size:10px;color:rgba(255,255,255,.75);letter-spacing:2px;margin-top:1px}
.header-stripe{height:5px;background:linear-gradient(90deg,#c8102e 0%,#e8384f 50%,#c8102e 100%)}

/* ── Cards ── */
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 14px rgba(0,0,0,.08);border:1px solid #e2e6ee}

/* ── Results ── */
.results-heading{font-size:16px;font-weight:900;text-align:center;color:#1a1a1a;margin-bottom:2px}
.results-date{font-size:12px;color:#555;text-align:center;margin-bottom:14px}
.results-row{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.main-balls{flex:1;display:flex;align-items:center;justify-content:space-around;background:#fff5f5;border:2px solid #f5c0c8;border-radius:12px;padding:10px 6px}
.strong-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#eaf4ff;border:2px solid #90c4f0;border-radius:12px;padding:8px 10px;min-width:58px}
.strong-lbl{font-size:9px;color:#1a3fa0;font-weight:700;text-align:center;line-height:1.3}
.ball{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0}
.ball-main{width:clamp(34px,5.5vw,44px);height:clamp(34px,5.5vw,44px);font-size:clamp(13px,2.2vw,16px);background:radial-gradient(circle at 38% 35%,#ff7a7a,#c8102e 55%,#8b0000)}
.ball-strong{width:36px;height:36px;font-size:15px;background:radial-gradient(circle at 38% 35%,#90c4f0,#2e6dd4 55%,#1a3fa0)}
.prize-row{display:flex;justify-content:space-between;align-items:center;background:#f8f9fc;border-radius:10px;padding:10px 14px;margin-top:2px}
.prize-item{text-align:center}
.prize-lbl{font-size:10px;color:#555;margin-bottom:2px}
.prize-val{font-size:clamp(13px,2.5vw,16px);font-weight:900;color:#c8102e}
.prize-divider{width:1px;background:#dde1ec;align-self:stretch}

/* ── Generator ── */
.gen-title{font-size:clamp(16px,3vw,20px);font-weight:900;text-align:center;color:#1a1a1a;margin-bottom:4px}
.gen-sub{font-size:12px;color:#555;text-align:center;margin-bottom:4px}
.next-draw{font-size:11px;color:#1a3fa0;font-weight:700;text-align:center;margin-bottom:16px;background:#eaf4ff;border-radius:8px;padding:6px 12px;display:block}

/* ── Strategy ── */
.strat-legend{font-size:13px;font-weight:700;color:#333;text-align:center;display:block;margin-bottom:10px}
.strat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.strat-radio{position:absolute;opacity:0;width:0;height:0}
.strat-radio:focus-visible+.strat-label{outline:3px solid #c8102e;outline-offset:2px;border-radius:12px}
.strat-label{border:2px solid #e2e6ee;border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .18s;display:block;background:#fafbff}
.strat-radio:checked+.strat-label{border-color:#c8102e;background:#fff5f5}
.strat-icon{font-size:22px;margin-bottom:4px;display:block}
.strat-name{font-size:12px;font-weight:900;color:#1a1a1a;display:block}
.strat-badge{display:inline-block;font-size:8px;font-weight:900;border-radius:5px;padding:2px 6px;margin-top:3px;background:#c8102e;color:#fff}
.strat-badge.hot{background:#e05000}
.strat-badge.due{background:#5c00a0}

/* ── Button ── */
.go-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;background:#c8102e;color:#fff;border:none;border-radius:50px;font-family:'Heebo',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:background .2s;touch-action:manipulation;box-shadow:0 4px 14px rgba(200,16,46,.35)}
.go-btn:hover:not(:disabled){background:#9b0020}
.go-btn:disabled{background:#ccc;color:#888;box-shadow:none;cursor:not-allowed}
.spin-icon{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Thinking ── */
.think-wrap{display:none;margin-bottom:12px;background:#fff5f5;border:1.5px solid #f5c0c8;border-radius:12px;padding:12px}
.think-wrap.show{display:block}
.think-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;margin-bottom:8px}
.think-row:last-child{margin-bottom:0}
.think-row.active{color:#c8102e;font-weight:700}
.think-row.done{color:#1b5e20}
.t-bar{flex:1;height:4px;background:#f5c0c8;border-radius:2px;overflow:hidden}
.t-fill{height:100%;border-radius:2px;width:0;transition:width .3s}
.think-row.done .t-fill{width:100%;background:#2e7d32}
.think-row.active .t-fill{background:#c8102e;animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{width:5%}50%{width:65%}100%{width:5%}}

/* ── Result ── */
.result-section{display:none}
.result-section.show{display:block}
.result-lbl{font-size:13px;font-weight:700;color:#333;text-align:center;margin-bottom:10px}
.balls-reveal-wrap{position:relative;background:#fff5f5;border:2px solid #f5c0c8;border-radius:14px;padding:14px 10px;margin-bottom:10px}
.result-balls-row{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.rball{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;animation:bpop .45s cubic-bezier(.34,1.56,.64,1) both;flex-shrink:0}
.rball-main{width:clamp(38px,6vw,50px);height:clamp(38px,6vw,50px);font-size:clamp(14px,2.5vw,18px);background:radial-gradient(circle at 38% 35%,#ff7a7a,#c8102e 55%,#8b0000)}
.rball-strong{width:clamp(38px,6vw,50px);height:clamp(38px,6vw,50px);font-size:clamp(14px,2.5vw,18px);background:radial-gradient(circle at 38% 35%,#90c4f0,#2e6dd4 55%,#1a3fa0)}
@keyframes bpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.plus-sep{color:#aaa;font-size:20px;font-weight:700}

/* ── Overlay ── */
.blur-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:rgba(255,255,255,.85);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:2px solid #c8102e}
.blur-overlay.hidden{display:none}
.pay-label{font-size:15px;font-weight:900;color:#8b0000;text-align:center}
.pay-sub{font-size:12px;color:#333;text-align:center;font-weight:600}
.pay-price-tag{display:inline-block;background:#c8102e;color:#fff;border-radius:8px;padding:3px 16px;font-weight:900;font-size:20px}
.pay-btn{background:#c8102e;color:#fff;border:none;border-radius:50px;padding:12px 28px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:900;cursor:pointer;touch-action:manipulation;transition:background .2s;box-shadow:0 4px 12px rgba(200,16,46,.35)}
.pay-btn:hover{background:#9b0020}

/* ── Why grid ── */
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0}
.why-card{background:#fafbff;border:1.5px solid #e2e6ee;border-radius:10px;padding:10px}
.why-ball-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.why-mini{width:24px;height:24px;background:#c8102e;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
.why-reason{font-size:10px;color:#333;line-height:1.5}
.why-bar{height:4px;background:#f5c0c8;border-radius:2px;margin-top:6px;overflow:hidden}
.why-fill{height:100%;background:#c8102e;border-radius:2px;transition:width 1.2s ease;width:0}
.num-mask{display:inline-block;background
