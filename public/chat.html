<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#E8232A;--red2:#B8181E;--yellow:#FFD700;
  --bg:#0C0B09;--card:#161310;--lifted:#1E1B15;
  --border:rgba(255,255,255,0.08);
  --cream:#FFF8EE;--warm:#E8D4B4;--dim:#7A6B58;--dim2:#3A3025;--green:#22C55E;
}
html{height:100%;height:100dvh}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--cream);display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(12,11,9,.97);flex-shrink:0;gap:8px}
.logo{font-family:'Rubik',sans-serif;font-weight:900;font-size:18px;color:var(--yellow);text-decoration:none;flex-shrink:0}
.logo span{color:var(--red)}
.cinfo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),#FF7C30);display:flex;align-items:center;justify-content:center;font-size:15px}
.clbl{line-height:1.2}
.cname{font-size:13px;font-weight:700;color:white}
.cst{font-size:10px;color:var(--green);display:flex;align-items:center;gap:3px}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sbadge{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.25);color:var(--yellow);border-radius:50px;padding:4px 10px;font-size:11px;font-weight:600;white-space:nowrap;display:none}
.ltog{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:50px;overflow:hidden}
.lb{padding:5px 10px;cursor:pointer;color:var(--dim);font-size:11px;font-weight:600;background:none;border:none;font-family:inherit;transition:all .15s}
.lb.on{background:var(--yellow);color:var(--bg);border-radius:50px}
.ubdg{display:none;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:50px;padding:4px 10px;font-size:11px;color:var(--dim);cursor:pointer}
.ubdg .ud{width:6px;height:6px;border-radius:50%;background:var(--green)}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:var(--dim2);border-radius:2px}
.mrow{display:flex;gap:8px;align-items:flex-end;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.mrow.u{flex-direction:row-reverse}
.mav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mav.c{background:linear-gradient(135deg,var(--red),#FF7C30)}
.mav.u{background:var(--lifted);border:1px solid var(--border)}
.bub{max-width:80%;padding:9px 13px;border-radius:15px;font-size:14px;line-height:1.6}
.bub.c{background:var(--lifted);border:1px solid var(--border);color:var(--warm);border-bottom-right-radius:4px}
[dir="ltr"] .bub.c{border-bottom-right-radius:15px;border-bottom-left-radius:4px}
.bub.u{background:var(--red);color:white;border-bottom-left-radius:4px}
[dir="ltr"] .bub.u{border-bottom-left-radius:15px;border-bottom-right-radius:4px}
.tbub{background:var(--lifted);border:1px solid var(--border);border-radius:15px;border-bottom-right-radius:4px;padding:11px 14px;display:inline-flex;gap:4px;align-items:center}
.td{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:td 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-5px);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 2px 34px}
[dir="ltr"] .chips{padding:2px 34px 2px 0}
.chip{background:rgba(232,35,42,.08);border:1px solid rgba(232,35,42,.28);color:#FF9098;border-radius:50px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip:hover{background:rgba(232,35,42,.2);color:white;transform:translateY(-2px)}
.ibar{padding:9px 11px;border-top:1px solid var(--border);background:rgba(12,11,9,.97);flex-shrink:0;display:flex;gap:8px;align-items:flex-end}
.ibox{flex:1;background:var(--lifted);border:1px solid var(--border);border-radius:20px;padding:9px 15px;font-size:14px;color:white;font-family:inherit;direction:inherit;outline:none;resize:none;max-height:90px;overflow-y:auto;line-height:1.5;transition:border-color .2s}

.ibox::placeholder{color:var(--dim)}
.sbtn{width:36px;height:36px;border-radius:50%;background:var(--red);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .2s;box-shadow:0 3px 10px rgba(232,35,42,.35)}
.sbtn:hover{background:var(--red2);transform:scale(1.08)}
.sbtn:disabled{opacity:.3;cursor:not-allowed;transform:none}
/* Vision card */
.vcard{background:linear-gradient(135deg,#1A0A0A,#0F0705);border:1px solid rgba(255,215,0,.2);border-radius:16px;padding:16px;max-width:380px;width:100%;animation:pop .4s ease both}
.vc-t{font-family:'Rubik',sans-serif;font-size:15px;font-weight:700;color:white;margin-bottom:10px}
.vc-row{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px}
.vc-l{color:var(--dim)}.vc-v{color:var(--warm);font-weight:600;text-align:end;max-width:60%}
[dir="ltr"] .vc-v{text-align:start}
.vc-div{height:1px;background:var(--border);margin:8px 0}
.vc-br{margin-bottom:7px}
.vc-bl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.vc-bl span:first-child{color:var(--dim)}
.vc-bg{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.vc-bf{height:100%;border-radius:2px;transition:width 1s ease}
.vc-ins{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.15);border-radius:9px;padding:9px 11px;font-size:12px;color:#E8C96A;margin-top:9px;line-height:1.5}
.vc-ins::before{content:'💡 '}
/* Motivation card */
.mot-card{background:linear-gradient(135deg,rgba(232,35,42,.12),rgba(255,215,0,.06));border:1px solid rgba(255,215,0,.2);border-radius:14px;padding:14px 16px;max-width:380px;font-size:14px;color:var(--warm);line-height:1.65;font-style:italic;animation:pop .4s ease both}
.mot-card::before{content:'✨ ';font-style:normal}
/* Auth */
.auth-ov{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .3s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.abox{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px 22px;width:100%;max-width:320px;text-align:center}
.a-logo{font-family:'Rubik',sans-serif;font-weight:900;font-size:22px;color:var(--yellow);margin-bottom:3px}
.a-logo span{color:var(--red)}
.a-tag{font-size:12px;color:var(--dim);margin-bottom:18px}
.a-title{font-family:'Rubik',sans-serif;font-size:17px;font-weight:700;color:white;margin-bottom:16px}
.a-err{background:rgba(232,35,42,.1);border:1px solid rgba(232,35,42,.25);border-radius:8px;padding:8px 11px;color:#FF9098;font-size:12px;margin-bottom:9px;display:none}
.ain{width:100%;background:var(--lifted);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;color:white;font-family:inherit;outline:none;direction:ltr;margin-bottom:8px;transition:border-color .2s;text-align:start}

.abtn{width:100%;background:var(--red);color:white;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 3px 12px rgba(232,35,42,.3);margin-bottom:8px}
.abtn:hover{background:var(--red2);transform:translateY(-2px)}
.abtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.a-note{font-size:11px;color:var(--dim2);margin-top:9px}
</style>
</head>

  ],

  vQ:[null,
    {m:'What will you feel when you find the right woman?',f:'What will you feel when you find the right man?'},
    {m:'What are you willing to change to get there?',f:'What are you willing to change to get there?'},

    {m:'Describe your ideal first date briefly.',f:'Describe your ideal first date briefly.'},
  ],

    ['Self-confidence','Emotional openness','Communication','Be more present'],
    [],[]
  ],
  emailPrompt:(n)=>`Amazing ${n}! 💛\nYour vision is saved.\n\nTo save your progress and pick up where we left off – enter your email:`,
  readyMsg:(n)=>`${n}, you're ready to start! 🎰\nI'm here with you at every stage.\n\nWhat's your status right now?`,

  coachQ2:()=>'What do you want to happen?',
  coachPush:()=>`Go get it! 💪`,

  wbMsg:(n)=>`Welcome back ${n}! 🎰`,

/* ══ SUPABASE ══ */
let sb=null;
async function initSB(){
  try{
    const r=await fetch('/api/env');
    const{supabaseUrl,supabaseKey}=await r.json();
    if(supabaseUrl?.includes('supabase')&&supabaseKey)
      sb=supabase.createClient(supabaseUrl,supabaseKey);
  }catch(e){}
}
async function saveData(){
  if(!sb||!A.user)return;
  try{
    await sb.from('user_data').upsert({
      user_id:A.user.id,email:A.email,
      stage:A.stage,gender:A.gender,name:A.userName,
      data:A.data,history:A.history.slice(-50),
      visit_count:A.visitCount,lang:A.lang,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id'});
  }catch(e){}
}
async function loadData(){
  if(!sb||!A.user)return false;
  try{
    const{data}=await sb.from('user_data').select('*').eq('user_id',A.user.id).single();
    if(data){
      A.stage=data.stage||'start';
      A.gender=data.gender||null;
      A.userName=data.name||'';
      A.data=data.data||{answers:{},vision:{},match:null,dates:[],step:{}};
      A.history=data.history||[];
      A.visitCount=(data.visit_count||0)+1;
      A.lang=data.lang||A.lang;
      return true;
    }
  }catch(e){}
  return false;
}

/* ══ AUTH ══ */
let authPhase='check'; // 'check'|'new_pw'|'login'
async function emailAuth(){
  const em=g('ain-e').value.trim();
  const pw=g('ain-p').value;
  const t=T[A.lang];
  if(!em.includes('@')){aerr('אימייל לא תקין');return;}
  g('abtn').disabled=true;g('abtxt').textContent=A.lang==='he'?'טוען...':'Loading...';

  if(!sb){
    // Demo mode
    A.email=em;A.userName=em.split('@')[0];
    hideAuth();startApp(false);return;
  }

  if(authPhase==='check'){
    // Try sign in first
    const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw||'demo123'});
    if(!error&&data.user){return;} // onAuthStateChange handles the rest
    // Show password field for registration
    g('ain-p').style.display='block';
    g('a-title').textContent=t.atitle_new;
    g('abtxt').textContent=t.btnNew;
    authPhase='new_pw';
    g('abtn').disabled=false;
    return;
  }
  if(authPhase==='new_pw'){
    if(pw.length<6){aerr(t.shortPw);g('abtn').disabled=false;g('abtxt').textContent=t.btnNew;return;}
    // Try register
    const{error:signUpErr}=await sb.auth.signUp({email:em,password:pw});
    if(signUpErr){
      // Maybe already exists – try login
      const{error:loginErr}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(loginErr){aerr(t.authErr);g('abtn').disabled=false;g('abtxt').textContent=t.btnNew;return;}
    }
    // onAuthStateChange handles rest
  }
}

function aerr(m){const e=g('a-err');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',4000);}
function hideAuth(){
  g('aov').style.display='none';
  const n=A.userName||A.user?.email?.split('@')[0];
  if(n){g('ubdg').style.display='flex';g('uname').textContent=n;}
}
async function signOut(){
  if(sb)await sb.auth.signOut();
  A.user=null;A.userName='';A.stage='start';A.history=[];A.data={answers:{},vision:{},match:null,dates:[],step:{}};
  g('ubdg').style.display='none';
  g('chat').innerHTML='';
  g('aov').style.display='flex';
  g('abtn').disabled=false;g('abtxt').textContent=T[A.lang].btnNew;
  g('a-err').style.display='none';
  g('ain-p').style.display='none';
  authPhase='check';
  track('sign_out');
}

/* ══ LANG ══ */
function setLang(l){
  A.lang=l;
  g('root').setAttribute('dir',l==='he'?'rtl':'ltr');
  g('root').setAttribute('lang',l);
  g('btn-he').classList.toggle('on',l==='he');
  g('btn-en').classList.toggle('on',l==='en');
  const t=T[l];
  g('cname').textContent=t.cn;g('cst').textContent=t.ls;g('ibox').placeholder=t.ph;
  g('a-tag').textContent=t.atag;g('a-note').textContent=t.anote;
  g('ain-e').placeholder=t.emailPh;g('ain-p').placeholder=t.pwPh;
  updateBadge();
  history.replaceState(null,'',l==='en'?'?lang=en':'?lang=he');
}
function updateBadge(){const b=g('sbadge'),l=T[A.lang].stages[A.stage];if(l){b.textContent=l;b.style.display='block';}}

/* ══ DOM ══ */
function g(id){return document.getElementById(id);}
function addMsg(txt,role){
  return new Promise(res=>{
    const area=g('chat');
    const row=document.createElement('div');row.className='mrow'+(role==='user'?' u':'');
    const av=document.createElement('div');av.className='mav '+(role==='user'?'u':'c');av.textContent=role==='user'?'😊':'🤖';
    const bub=document.createElement('div');bub.className='bub '+(role==='user'?'u':'c');bub.innerHTML=txt.replace(/\n/g,'<br>');
    if(role==='user'){row.appendChild(bub);row.appendChild(av);}else{row.appendChild(av);row.appendChild(bub);}
    area.appendChild(row);scroll();
    A.history.push({role:role==='user'?'user':'assistant',content:txt});
    res();
  });
}
function addChips(opts,cb){
  const area=g('chat');const row=document.createElement('div');row.className='chips';row.id='chips';
  opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{rmChips();cb(o);};row.appendChild(b);});
  area.appendChild(row);scroll();
}
function rmChips(){const r=g('chips');if(r)r.remove();}
function showT(){
  const area=g('chat');const row=document.createElement('div');row.className='mrow';row.id='trow';
  const av=document.createElement('div');av.className='mav c';av.textContent='🤖';
  const bub=document.createElement('div');bub.className='tbub';
  bub.innerHTML='<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(av);row.appendChild(bub);area.appendChild(row);scroll();
  g('cst').textContent=T[A.lang].tp;
}
function hideT(){const r=g('trow');if(r)r.remove();g('cst').textContent=T[A.lang].ls;}
function scroll(){setTimeout(()=>{const c=g('chat');c.scrollTop=c.scrollHeight;},60);}
function dis(v){A.busy=v;g('ibox').disabled=v;g('sbtn').disabled=v;g('ibox').placeholder=v?(A.lang==='he'?'לוטו מקליד...':'Loto is typing...'):T[A.lang].ph;}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

/* ══ SAY ══ */
async function say(txt,ms=900){dis(true);showT();await wait(ms);hideT();await addMsg(txt,'coach');dis(false);}
async function sayC(txt,chips,cb,ms=900){await say(txt,ms);addChips(chips,cb);}

/* ══ VISION CARD ══ */
function showVC(){
  const t=T[A.lang],v=A.data.vision,c=parseInt(A.data.answers?.q4)||5;
  const cf=Math.min(95,c*8+20),em=Math.min(90,c*6+35),co=Math.min(88,c*7+25);
  const uid=Date.now();
  const card=document.createElement('div');card.className='vcard';
  card.innerHTML=`<div class="vc-t">${t.vcTitle}</div>
${v.goal?`<div class="vc-row"><span class="vc-l">${t.vcL.goal}</span><span class="vc-v">${v.goal}</span></div>`:''}
${v.feel?`<div class="vc-row"><span class="vc-l">${t.vcL.feel}</span><span class="vc-v">${v.feel}</span></div>`:''}
${v.change?`<div class="vc-row"><span class="vc-l">${t.vcL.change}</span><span class="vc-v">${v.change}</span></div>`:''}
${v.fear?`<div class="vc-row"><span class="vc-l">${t.vcL.fear}</span><span class="vc-v">${v.fear}</span></div>`:''}
<div class="vc-div"></div>
<div class="vc-br"><div class="vc-bl"><span>${t.bars[0]}</span><span style="color:var(--red)">${cf}%</span></div><div class="vc-bg"><div class="vc-bf" id="b1-${uid}" style="width:0%;background:var(--red)"></div></div></div>
<div class="vc-br"><div class="vc-bl"><span>${t.bars[1]}</span><span style="color:var(--yellow)">${em}%</span></div><div class="vc-bg"><div class="vc-bf" id="b2-${uid}" style="width:0%;background:var(--yellow)"></div></div></div>
<div class="vc-br"><div class="vc-bl"><span>${t.bars[2]}</span><span style="color:var(--green)">${co}%</span></div><div class="vc-bg"><div class="vc-bf" id="b3-${uid}" style="width:0%;background:var(--green)"></div></div></div>
<div class="vc-ins">${t.ins(A.data.answers?.q4)}</div>`;
  g('chat').appendChild(card);scroll();
  setTimeout(()=>{
    const b1=g(`b1-${uid}`);const b2=g(`b2-${uid}`);const b3=g(`b3-${uid}`);
    if(b1)b1.style.width=cf+'%';if(b2)b2.style.width=em+'%';if(b3)b3.style.width=co+'%';

/* ══ MOTIVATION CARD ══ */
async function showMotivation(){
  const quote=randomQuote();
  const card=document.createElement('div');card.className='mot-card';
  card.textContent=quote;
  g('chat').appendChild(card);scroll();
  track('motivation_shown');
}

/* ══ ONBOARDING ══ */
async function startOnboarding(){
  A.stage='onboarding';A.data.step={qIdx:0};updateBadge();
  const t=T[A.lang];
  await sayC(t.genderQ,t.genderC,async(v)=>{
    A.gender=v==='גבר'||v==='Male'?'m':'f';
    await addMsg(v,'user');
    const nq=t.nameQ[A.gender];
    await say(nq,600);
    track('onboarding_start',{gender:A.gender});
  });
}

async function doOnboarding(msg){
  const t=T[A.lang];
  const qi=A.data.step.qIdx||0;
  if(qi===0){A.userName=msg;A.data.answers.q0=msg;}
  else{A.data.answers[`q${qi}`]=msg;}
  A.data.step.qIdx=qi+1;
  const nextQi=qi+1;
  if(nextQi<t.oQ.length){
    const qObj=t.oQ[nextQi];
    const q=qObj?qObj[A.gender]||qObj.m:null;
    const chips=t.oC[nextQi]||[];
    if(chips.length)await sayC(q,chips,v=>sendDirect(v));
    else await say(q);
  }else{
    // Onboarding done → vision
    A.stage='vision';A.data.step={vIdx:0};updateBadge();
    track('onboarding_complete');
    await say(t.visionIntro(A.userName,A.gender),1000);
  }
}

/* ══ VISION ══ */
async function doVision(msg){
  const t=T[A.lang];
  const vi=A.data.step.vIdx||0;
  const keys=['goal','feel','change','fear','idealDate'];
  A.data.vision[keys[vi]]=msg;
  A.data.step.vIdx=vi+1;
  const nextVi=vi+1;
  if(nextVi<t.vQ.length){
    const qObj=t.vQ[nextVi];
    const q=qObj?qObj[A.gender]||qObj.m:null;
    const chips=t.vC[nextVi]||[];
    if(chips.length)await sayC(q,chips,v=>sendDirect(v));
    else await say(q);
  }else{
    // Vision done → show card → ask email
    track('vision_complete');
    await wait(400);showVC();await wait(800);
    await say(t.emailPrompt(A.userName),1000);
    A.stage='awaiting_email';updateBadge();
  }
}

/* ══ EMAIL COLLECTION (after vision) ══ */
async function doAwaitingEmail(msg){
  const t=T[A.lang];
  if(!msg.includes('@')){
    await say(A.lang==='he'?'נראה שזה לא אימייל תקין, נסה שוב 😊':'That doesn\'t look like a valid email, try again 😊',600);
    return;
  }
  A.email=msg;
  // Register/login with this email
  if(sb){
    const{error}=await sb.auth.signInWithOtp({email:msg,options:{shouldCreateUser:true}});
    if(!error){
      await say(A.lang==='he'
        ?`📬 שלחנו לך מייל אישור לכתובת ${msg}.\nלחץ/י על הקישור כדי להתחבר ולהמשיך.`
        :`📬 We sent a confirmation email to ${msg}.\nClick the link to sign in and continue.`,800);
    }
  }
  A.stage='registered';updateBadge();await saveData();
  track('email_collected');
  await wait(600);
  await sayC(t.readyMsg(A.userName,A.gender),t.statusC,v=>sendDirect(v),1000);
}

/* ══ COACHING FLOW (main loop) ══ */
async function doCoaching(msg){
  const t=T[A.lang];
  const step=A.data.step;

  if(!step.coachPhase){
    // First message → show "אני כאן איתך"
    step.coachPhase='asked_how';
    await say(t.coachGreet(A.userName),800);
    return;
  }
  if(step.coachPhase==='asked_how'){
    step.coachPhase='asked_want';
    step.feeling=msg;
    await say(t.coachQ1(A.gender),700);
    return;
  }
  if(step.coachPhase==='asked_want'){
    step.coachPhase='pushed';
    step.feeling2=msg;
    await say(t.coachQ2(A.gender),700);
    return;
  }
  if(step.coachPhase==='pushed'){
    step.coachPhase='done';
    step.want=msg;
    // Show motivation
    await say(t.coachPush(A.gender),600);
    await wait(300);await showMotivation();
    // If returning (visitCount > 1) also show vision reminder
    if(A.visitCount>1&&A.data.vision?.goal){
      await wait(500);
      await say(t.rememberVision,500);
      await wait(300);showVC();
    }
    await saveData();
    // Next time they come back → ask status
    step.waitingForReturn=true;
    step.coachPhase=null;
    return;
  }
  // Default fallback
  await aiSay(msg);
}

/* ══ STATUS CHECK (returning user) ══ */
async function doStatus(msg){
  const t=T[A.lang];
  A.data.step={};// reset step
  A.data.lastStatus=msg;
  track('status_update',{status:msg});
  // Start fresh coaching cycle
  await doCoaching(msg);
}

/* ══ REGISTERED ROUTER ══ */
async function doRegistered(msg){
  const t=T[A.lang];
  const step=A.data.step||{};

  // If we were waiting for status
  if(step.waitingForReturn){
    A.data.step.waitingForReturn=false;
    await sayC(t.statusQ,t.statusC,v=>sendDirect(v),700);
    return;
  }
  await doCoaching(msg);
}

/* ══ AI FALLBACK ══ */
async function aiSay(msg){
  dis(true);showT();
  try{
    const res=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:A.history.slice(-10),lang:A.lang,stage:A.stage,userName:A.userName,vision:A.data.vision,gender:A.gender})});
    if(!res.ok)throw 0;
    const{reply}=await res.json();
    hideT();await addMsg(reply,'coach');
  }catch(e){
    hideT();
    await addMsg(A.lang==='he'
      ?'אני כאן איתך 💪 ספר/י לי יותר...'
      :"I'm here with you 💪 Tell me more...",'coach');
  }
  dis(false);await saveData();
}

/* ══ ROUTER ══ */
async function route(msg){
  switch(A.stage){
    case 'onboarding':     await doOnboarding(msg);break;
    case 'vision':         await doVision(msg);break;
    case 'awaiting_email': await doAwaitingEmail(msg);break;
    case 'registered':
    case 'coaching':       await doRegistered(msg);break;
    default:               await aiSay(msg);
  }
  await saveData();
}

/* ══ INPUT ══ */
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function autoH(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}
async function send(){
  const box=g('ibox'),txt=box.value.trim();
  if(!txt||A.busy)return;
  box.value='';box.style.height='auto';rmChips();
  await addMsg(txt,'user');await route(txt);
}
async function sendDirect(txt){rmChips();await addMsg(txt,'user');await route(txt);}

/* ══ START APP ══ */
async function startApp(isReturning){
  track('session_start',{returning:isReturning,visit:A.visitCount});

  if(isReturning&&A.stage&&A.stage!=='start'){
    // Returning user – restore last few messages
    A.visitCount++;
    const name=A.userName;updateBadge();
    const last=A.history.slice(-4);
    last.forEach(m=>{
      const row=document.createElement('div');row.className='mrow'+(m.role==='user'?' u':'');
      const av=document.createElement('div');av.className='mav '+(m.role==='user'?'u':'c');av.textContent=m.role==='user'?'😊':'🤖';
      const bub=document.createElement('div');bub.className='bub '+(m.role==='user'?'u':'c');bub.innerHTML=m.content.replace(/\n/g,'<br>');
      if(m.role==='user'){row.appendChild(bub);row.appendChild(av);}else{row.appendChild(av);row.appendChild(bub);}
      g('chat').appendChild(row);
    });
    scroll();
    const t=T[A.lang];
    await wait(400);
    A.data.step=A.data.step||{};
    A.data.step.waitingForReturn=true;
    await sayC(
      t.wbMsg(name,A.gender||'m')+'\n'+t.statusQ,
      t.statusC,
      v=>sendDirect(v),800
    );
  }else{
    // New user
    A.stage='onboarding';A.visitCount=1;
    await startOnboarding();
  }
}

/* ══ INIT ══ */
async function init(){
  const p=new URLSearchParams(location.search),lang=p.get('lang')==='en'?'en':'he';
  setLang(lang);
  await initSB();

  // Setup auth UI
  const t=T[lang];
  g('a-title').textContent=t.atitle_new;
  g('abtxt').textContent=t.btnNew;

  if(!sb){
    // Demo mode – simple name entry
    g('a-title').textContent=lang==='he'?'איך קוראים לך? 👋':"What's your name? 👋";
    g('ain-e').type='text';g('ain-e').placeholder=lang==='he'?'השם שלך...':'Your name...';
    g('abtxt').textContent=lang==='he'?'בואו נתחיל 🎰':"Let's go 🎰";
    g('a-note').textContent=lang==='he'?'חינמי':'Free';
    window.emailAuth=function(){
      const n=g('ain-e').value.trim()||(lang==='he'?'חבר/ה':'friend');
      A.userName=n;A.email=n;hideAuth();startApp(false);
    };
    return;
  }

  // Listen for auth state changes
  sb.auth.onAuthStateChange(async(ev,sess)=>{
    if(sess?.user&&!A.user){
      A.user=sess.user;A.email=sess.user.email;
      A.userName=sess.user.email.split('@')[0];
      const isReturning=await loadData();
      hideAuth();startApp(isReturning);
    }
  });

  // Already logged in?
  const{data}=await sb.auth.getSession();
  if(data?.session?.user){
    A.user=data.session.user;A.email=A.user.email;
    A.userName=A.user.email.split('@')[0];
    const isReturning=await loadData();
    hideAuth();startApp(isReturning);
  }
  // Otherwise auth overlay stays
}

init();
</script>
