<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LotoIsrael – המאמן שלך</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;700;900&family=Assistant:wght@300;400;600;700&family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height: 100%; }
body {
  font-family: 'Assistant', sans-serif;
  background: var(--bg);
  color: var(--cream);
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  /* Safe areas for notch + home bar (iOS/Android) */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
[dir="ltr"] { font-family: 'DM Sans', sans-serif; }

/* ── GRAIN ── */
body::before {
  content:''; position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.025; pointer-events:none; z-index:9999;
}

/* ── HEADER ── */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  background:rgba(12,11,9,0.95);
  backdrop-filter:blur(10px);
  flex-shrink:0;
  position:relative; z-index:10;
  overflow:hidden;
  gap:8px;
}

.logo {
  font-family:'Rubik',sans-serif;
  font-weight:900; font-size:18px;
  color:var(--yellow);
  text-decoration:none;
  flex-shrink:0;
}
.logo span { color:var(--red); }

.coach-info { display:flex; align-items:center; gap:10px; }

.coach-av {
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,var(--red),#FF7C30);
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  flex-shrink:0;
  box-shadow:0 0 16px rgba(232,35,42,0.4);
  animation:avPulse 3s ease-in-out infinite;
}
@keyframes avPulse {
  0%,100%{box-shadow:0 0 10px rgba(232,35,42,0.3);}
  50%{box-shadow:0 0 24px rgba(232,35,42,0.6);}
}

.coach-meta { line-height:1.2; }
.coach-meta-name { font-size:13px; font-weight:700; color:white; }
.coach-meta-status { font-size:10px; color:var(--green); display:flex; align-items:center; gap:4px; }

.progress-wrap { display:flex; align-items:center; gap:8px; }
.prog-label { font-size:11px; color:var(--dim); }
.prog-track { width:60px; height:4px; background:rgba(255,255,255,0.07); border-radius:2px; overflow:hidden; }
.prog-fill { height:100%; border-radius:2px; background:linear-gradient(to left,var(--yellow),var(--red)); transition:width 0.6s ease; }
[dir="ltr"] .prog-fill { background:linear-gradient(to right,var(--red),var(--yellow)); }

/* hide progress on small screens */
@media (max-width: 400px) {
  .progress-wrap { display: none; }
  .coach-meta-name { font-size:12px; }
}
.status-dot { width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* ── CHAT AREA ── */
.chat-area {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:24px 16px 16px;
  display:flex; flex-direction:column; gap:12px;
  scroll-behavior:smooth;
}

/* scrollbar */
.chat-area::-webkit-scrollbar { width:4px; }
.chat-area::-webkit-scrollbar-track { background:transparent; }
.chat-area::-webkit-scrollbar-thumb { background:var(--dim2); border-radius:2px; }

.msg-row {
  display:flex; gap:10px; align-items:flex-end;
  animation:msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes msgIn {
  from{opacity:0;transform:translateY(16px) scale(0.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

.msg-row.user-row { flex-direction:row-reverse; }

.msg-av {
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px; flex-shrink:0;
}
.msg-av.coach-av-sm {
  background:linear-gradient(135deg,var(--red),#FF7C30);
}
.msg-av.user-av-sm {
  background:var(--lifted);
  border:1px solid var(--border);
  font-size:16px;
}

.bubble {
  max-width:75%;
  padding:12px 16px;
  border-radius:18px;
  font-size:15px;
  line-height:1.6;
  position:relative;
}

.bubble.coach {
  background:var(--lifted);
  border:1px solid var(--border);
  color:var(--warm);
  border-bottom-right-radius:4px;
}
[dir="rtl"] .bubble.coach { border-bottom-right-radius:4px; border-bottom-left-radius:18px; }
[dir="ltr"] .bubble.coach { border-bottom-left-radius:4px; border-bottom-right-radius:18px; }

.bubble.user {
  background:var(--red);
  color:white;
  border-bottom-left-radius:4px;
}
[dir="rtl"] .bubble.user { border-bottom-left-radius:4px; border-bottom-right-radius:18px; }
[dir="ltr"] .bubble.user { border-bottom-right-radius:4px; border-bottom-left-radius:18px; }

/* Typing indicator */
.typing-bubble {
  background:var(--lifted);
  border:1px solid var(--border);
  border-radius:18px;
  border-bottom-right-radius:4px;
  padding:14px 18px;
  display:inline-flex; gap:5px; align-items:center;
}
[dir="rtl"] .typing-bubble { border-bottom-right-radius:4px; border-bottom-left-radius:18px; }
[dir="ltr"] .typing-bubble { border-bottom-left-radius:4px; border-bottom-right-radius:18px; }

.t-dot {
  width:7px;height:7px;border-radius:50%;background:var(--dim);
  animation:tdot 1.3s ease-in-out infinite;
}
.t-dot:nth-child(2){animation-delay:0.2s;}
.t-dot:nth-child(3){animation-delay:0.4s;}
@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:0.35;}40%{transform:translateY(-6px);opacity:1;}}

/* Quick reply chips */
.chips-row {
  display:flex; flex-wrap:wrap; gap:8px;
  padding:4px 0 0 40px;
  animation:msgIn 0.3s 0.1s ease both;
}
[dir="ltr"] .chips-row { padding:4px 40px 0 0; }

.chip {
  background:rgba(232,35,42,0.08);
  border:1px solid rgba(232,35,42,0.25);
  color:#FF9098;
  border-radius:50px;
  padding:8px 16px;
  font-size:13px; font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all 0.2s;
  white-space:nowrap;
}
.chip:hover { background:rgba(232,35,42,0.18); border-color:var(--red); color:white; transform:translateY(-2px); }
.chip:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

/* ── SIGNUP CARD (in-chat) ── */
.signup-card {
  background:linear-gradient(135deg,#1A1008,#120C06);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:20px;
  padding:24px;
  margin:8px 0;
  animation:msgIn 0.4s 0.2s ease both;
  max-width:480px;
}

.signup-card-header {
  display:flex; align-items:center; gap:12px; margin-bottom:16px;
}
.signup-card-icon { font-size:28px; }
.signup-card-title {
  font-family:'Rubik',sans-serif;
  font-size:18px; font-weight:700; color:white;
}
.signup-card-sub { font-size:13px; color:var(--dim); margin-top:2px; }

.signup-form-inline { display:flex; flex-direction:column; gap:10px; }

.signup-input-inline {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:13px 16px;
  font-size:15px; color:white;
  font-family:inherit;
  outline:none; direction:inherit;
  transition:border-color 0.2s;
}
.signup-input-inline::placeholder { color:var(--dim); }
.signup-input-inline:focus { border-color:rgba(255,215,0,0.4); }

.signup-btn-inline {
  background:var(--red);
  color:white; border:none; border-radius:12px;
  padding:14px; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit;
  transition:all 0.2s;
  box-shadow:0 4px 20px rgba(232,35,42,0.3);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.signup-btn-inline:hover { background:var(--red2); transform:translateY(-2px); }

.signup-note-inline { font-size:11px; color:var(--dim2); text-align:center; }

/* ── REPORT CARD ── */
.report-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  max-width:480px;
  animation:msgIn 0.5s 0.3s ease both;
}

.report-header {
  background:linear-gradient(135deg,#1A0A0A,#0F0705);
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.report-icon { font-size:28px; }
.report-title {
  font-family:'Rubik',sans-serif;
  font-size:17px; font-weight:700; color:white;
}
.report-sub { font-size:12px; color:var(--dim); margin-top:2px; }

.report-body { padding:16px 20px; display:flex; flex-direction:column; gap:12px; }

.report-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.report-label { font-size:13px; color:var(--dim); flex-shrink:0; }
.report-value { font-size:13px; font-weight:600; color:var(--warm); text-align:end; }
[dir="ltr"] .report-value { text-align:start; }

.report-bar-row { display:flex; flex-direction:column; gap:6px; }
.report-bar-label { display:flex; justify-content:space-between; font-size:12px; }
.report-bar-label span:first-child { color:var(--dim); }
.report-bar-label span:last-child { font-weight:700; }
.report-bar-bg { height:6px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
.report-bar-fill { height:100%; border-radius:3px; transition:width 1.2s cubic-bezier(0.4,0,0.2,1); }

.report-insight {
  background:rgba(255,215,0,0.06);
  border:1px solid rgba(255,215,0,0.15);
  border-radius:12px;
  padding:12px 14px;
  font-size:13px; color:#E8C96A;
  line-height:1.6;
}
.report-insight::before { content:'💡 '; }

.report-cta {
  background:var(--red);
  color:white; border:none; border-radius:12px;
  padding:13px; font-size:14px; font-weight:700;
  cursor:pointer; font-family:inherit;
  transition:all 0.2s; width:100%;
  box-shadow:0 4px 16px rgba(232,35,42,0.3);
}
.report-cta:hover { background:var(--red2); transform:translateY(-2px); }

/* ── INPUT BAR ── */
.input-bar {
  padding:12px 16px;
  border-top:1px solid var(--border);
  background:rgba(12,11,9,0.97);
  backdrop-filter:blur(10px);
  flex-shrink:0;
  display:flex; gap:10px; align-items:flex-end;
}

.input-box {
  flex:1;
  background:var(--lifted);
  border:1px solid var(--border);
  border-radius:20px;
  padding:11px 18px;
  font-size:15px; color:white;
  font-family:inherit; direction:inherit;
  outline:none; resize:none;
  max-height:120px; overflow-y:auto;
  line-height:1.5;
  transition:border-color 0.2s;
}
.input-box::placeholder { color:var(--dim); }
.input-box:focus { border-color:rgba(232,35,42,0.4); }

.send-btn {
  width:42px;height:42px;border-radius:50%;
  background:var(--red); border:none; cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px; flex-shrink:0;
  transition:all 0.2s;
  box-shadow:0 4px 14px rgba(232,35,42,0.35);
}
.send-btn:hover { background:var(--red2); transform:scale(1.08); }
.send-btn:disabled { opacity:0.3; cursor:not-allowed; transform:none; }

/* ── LANG TOGGLE ── */
.lang-toggle {
  display:flex;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:50px;
  overflow:hidden; font-size:12px;
}
.lang-btn {
  padding:5px 12px; cursor:pointer;
  color:var(--dim); transition:all 0.15s;
  user-select:none; font-family:inherit;
  font-size:12px; background:none; border:none;
}
.lang-btn.active { background:var(--yellow); color:var(--bg); border-radius:50px; font-weight:700; }

/* ── AUTH OVERLAY ── */
.auth-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.auth-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px 28px;
  width: 100%; max-width: 360px;
  text-align: center;
}
.auth-logo {
  font-family:'Rubik',sans-serif;
  font-weight:900; font-size:26px;
  color:var(--yellow); margin-bottom:4px;
}
.auth-logo span { color:var(--red); }
.auth-tagline { font-size:13px; color:var(--dim); margin-bottom:24px; }
.auth-title {
  font-family:'Rubik',sans-serif;
  font-size:19px; font-weight:700; color:white; margin-bottom:20px;
}

/* Google button */
.btn-google {
  width:100%; background:white; color:#1A1A1A;
  border:none; border-radius:12px; padding:13px 16px;
  font-size:15px; font-weight:600; cursor:pointer;
  font-family:inherit; transition:all 0.2s;
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.btn-google:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,0.4); }
.btn-google img { width:18px; height:18px; }

/* Divider */
.auth-divider {
  display:flex; align-items:center; gap:12px;
  margin-bottom:16px;
}
.auth-divider::before, .auth-divider::after {
  content:''; flex:1; height:1px; background:var(--border);
}
.auth-divider span { font-size:12px; color:var(--dim); white-space:nowrap; }

/* Inputs */
.auth-input {
  width:100%; background:var(--lifted);
  border:1px solid var(--border); border-radius:12px;
  padding:12px 16px; font-size:15px; color:white;
  font-family:inherit; outline:none; direction:ltr;
  margin-bottom:10px; transition:border-color 0.2s;
  text-align:start;
}
.auth-input:focus { border-color:rgba(232,35,42,0.5); }

.btn-email {
  width:100%; background:var(--red); color:white;
  border:none; border-radius:12px; padding:13px;
  font-size:15px; font-weight:700; cursor:pointer;
  font-family:inherit; transition:all 0.2s;
  box-shadow:0 4px 16px rgba(232,35,42,0.3);
  margin-bottom:10px;
}
.btn-email:hover { background:var(--red2); transform:translateY(-2px); }
.btn-email:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* Toggle login/register */
.auth-toggle {
  font-size:13px; color:var(--dim); margin-top:4px;
}
.auth-toggle a {
  color:var(--yellow); cursor:pointer; font-weight:600; text-decoration:none;
}
.auth-toggle a:hover { text-decoration:underline; }

.auth-error {
  background:rgba(232,35,42,0.1); border:1px solid rgba(232,35,42,0.25);
  border-radius:10px; padding:10px 14px;
  color:#FF9098; font-size:13px; margin-bottom:10px; display:none;
}

.auth-note { font-size:11px; color:var(--dim2); margin-top:12px; }

/* User badge in header */
.user-badge {
  display:none; align-items:center; gap:6px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:50px; padding:5px 12px;
  font-size:12px; color:var(--dim); cursor:pointer;
}
.user-badge:hover { border-color:rgba(232,35,42,0.3); }
.user-badge .ub-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }

</style>
</head>
<body>

<!-- ── AUTH OVERLAY ── -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">Loto<span>Israel</span></div>
    <div class="auth-tagline" id="auth-tagline">מאמן הדייטינג האישי שלך 🎰</div>
    <div class="auth-title" id="auth-title">כניסה / הרשמה</div>

    <!-- Google -->
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      <span id="google-btn-txt">המשך עם Google</span>
    </button>

    <div class="auth-divider"><span id="divider-txt">או עם אימייל</span></div>

    <div class="auth-error" id="auth-error"></div>

    <input type="email"    class="auth-input" id="auth-email"    placeholder="אימייל" autocomplete="email" />
    <input type="password" class="auth-input" id="auth-password" placeholder="סיסמא (מינימום 6 תווים)" autocomplete="current-password" />
    <button class="btn-email" id="btn-email" onclick="emailAuth()">
      <span id="email-btn-txt">כניסה / הרשמה</span>
    </button>

    <div class="auth-toggle" id="auth-toggle">
      <span id="toggle-txt">משתמש חדש?</span>
      <a onclick="toggleMode()" id="toggle-link">צור חשבון</a>
    </div>

    <p class="auth-note" id="auth-note">חינמי · ללא כרטיס אשראי · הנתונים שלך שמורים</p>
  </div>
</div>

<!-- ── HEADER ── -->
<div class="header">
  <a href="/" class="logo">Loto<span>Israel</span></a>

  <div class="coach-info">
    <div class="coach-av">🤖</div>
    <div class="coach-meta">
      <div class="coach-meta-name" id="coach-name">המאמן שלך</div>
      <div class="coach-meta-status">
        <div class="status-dot"></div>
        <span id="coach-status">מקשיב...</span>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px">
    <div class="user-badge" id="user-badge" onclick="signOut()">
      <div class="ub-dot"></div>
      <span id="user-email-short"></span>
    </div>
    <div class="progress-wrap">
      <span class="prog-label" id="prog-label">0 / 5</span>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-he" onclick="setLang('he')">עב</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</div>

<!-- ── CHAT ── -->
<div class="chat-area" id="chat-area"></div>

<!-- ── INPUT ── -->
<div class="input-bar">
  <textarea class="input-box" id="input-box" rows="1"
    placeholder="כתוב כאן..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" title="שלח">➤</button>
</div>

<script>
/* ════════════════════════════
   STATE
════════════════════════════ */
const S = {
  lang: 'he',
  phase: 'chat',        // 'chat' | 'signup' | 'report'
  msgCount: 0,
  totalQ: 5,
  answers: {},
  signedUp: false,
  history: [],          // for Anthropic API
  isTyping: false,
  userEmoji: '🙂'
};

/* ════════════════════════════
   SYSTEM PROMPTS
════════════════════════════ */
const SYSTEM = {
  he: `אתה מאמן דייטינג וזוגיות אישי חם, שובב ואנושי של LotoIsrael.

function generateInsightHe(a) {
  const comfort = parseInt(a.comfort) || 5;
  if (comfort <= 4) return 'החוזק הגדול שלך הוא שאתה מודע לאתגרים שלך – זה כבר חצי מהדרך. נעבוד על ביטחון מעשי שיניב תוצאות מיידיות.';
  if (comfort >= 8) return 'יש לך בסיס חזק של ביטחון עצמי! נעבוד על לחדד את התקשורת הרגשית שלך כדי להפוך דייטים טובים לזוגיות אמיתית.';
  return 'אתה במקום מאוזן – יש ביטחון בסיסי אבל יש מקום לצמוח. נתמקד בטכניקות שיעזרו לך להמיר דייטים ראשונים לשניים.';
}
function generateInsightEn(a) {
  const comfort = parseInt(a.comfort) || 5;
  if (comfort <= 4) return 'Your biggest strength is self-awareness – that\'s already half the battle. We\'ll work on practical confidence that gets immediate results.';
  if (comfort >= 8) return 'You have a solid confidence foundation! We\'ll work on sharpening your emotional communication to turn good dates into real relationships.';
  return 'You\'re in a balanced place – solid base but room to grow. We\'ll focus on techniques to convert first dates into second ones.';
}

function setLang(lang) {
  S.lang = lang;
  const root = document.getElementById('html-root');
  root.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
  root.setAttribute('lang', lang);
  document.getElementById('btn-he').classList.toggle('active', lang === 'he');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  const t = T[lang];
  document.getElementById('coach-name').textContent = t.coachName;
  document.getElementById('coach-status').textContent = t.coachStatus;
  document.getElementById('input-box').placeholder = t.inputPh;

  // Re-translate all coach bubbles that have a data-msgkey
  document.querySelectorAll('.bubble.coach[data-msgkey]').forEach(bub => {
    const key = bub.dataset.msgkey;
    const val = t[key];
    if (!val) return;
    const text = typeof val === 'function' ? val(S.userName || '') : val;
    bub.innerHTML = text.replace(/\n/g, '<br>');
  });

  // Re-translate fallback replies index labels (chips if any)
  document.querySelectorAll('.chip[data-langkey]').forEach(chip => {
    const key = chip.dataset.langkey;
    chip.textContent = t[key] || chip.textContent;
  });
}

/* ════════════════════════════
   CHAT RENDERING
════════════════════════════ */
function addMsg(text, role, delay = 0, msgKey = null) {
  return new Promise(resolve => {
    setTimeout(() => {
      const area = document.getElementById('chat-area');

      const row = document.createElement('div');
      row.className = `msg-row ${role === 'user' ? 'user-row' : ''}`;

      const av = document.createElement('div');
      av.className = `msg-av ${role === 'user' ? 'user-av-sm' : 'coach-av-sm'}`;
      av.textContent = role === 'user' ? S.userEmoji : '🤖';

      const bub = document.createElement('div');
      bub.className = `bubble ${role === 'user' ? 'user' : 'coach'}`;
      bub.innerHTML = text.replace(/\n/g, '<br>');
      if (role === 'coach' && msgKey) bub.dataset.msgkey = msgKey;

      row.appendChild(av);
      row.appendChild(bub);
      area.appendChild(row);
      scrollBottom();
      resolve();
    }, delay);
  });
}

function addChips(options, onSelect) {
  const area = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = 'chips-row';
  row.id = 'chips-row';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = opt;
    btn.onclick = () => {
      row.remove();
      onSelect(opt);
    };
    row.appendChild(btn);
  });
  area.appendChild(row);
  scrollBottom();
}

function removeChips() {
  const r = document.getElementById('chips-row');
  if (r) r.remove();
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'msg-av coach-av-sm'; av.textContent = '🤖';
  const bub = document.createElement('div');
  bub.className = 'typing-bubble';
  bub.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';

function scrollBottom() {

function updateProgress(n) {

/* ════════════════════════════
   CLAUDE API CALL
════════════════════════════ */
async function callClaude(userMsg) {
  S.history.push({ role: 'user', content: userMsg });

  showTyping();
  setInputDisabled(true);

  try {
    const res = await fetch('/api/coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: S.history, lang: S.lang })
    });

    if (!res.ok) throw new Error('API error');

    const data = await res.json();
    const reply = data.reply || '';

    hideTyping();
    updateProgress(Math.floor(S.history.filter(m => m.role === 'user').length));

    if (reply.trim() === 'DONE' || reply.trim().startsWith('DONE')) {
      extractAnswers();
      await triggerSignup();
    } else {
      // Store reply in history for context
      S.history.push({ role: 'assistant', content: reply });
      await addMsg(reply, 'coach');
      setInputDisabled(false);
      document.getElementById('input-box').focus();
    }

  } catch (err) {
    // Fallback if no API or error
    hideTyping();
    updateProgress(Math.floor(S.history.filter(m => m.role === 'user').length));
    const fb = getFallbackReply();
    if (fb && fb.text) {
      await addMsg(fb.text, 'coach', 0, fb.key);
    }
    setInputDisabled(false);
    document.getElementById('input-box').focus();
  }
}

/* Fallback for demo without API key */
const fallbackReplies = ['fallback0','fallback1','fallback2','fallback3'];

let fallbackIdx = 0;
function getFallbackReply() {
  if (fallbackIdx >= fallbackReplies.length) {
    const key = 'fallbackDone';
    setTimeout(async () => {
      extractAnswers();
      await triggerSignup();
    }, 300);
    return { text: T[S.lang][key], key };
  }
  const key = fallbackReplies[fallbackIdx++];
  return { text: T[S.lang][key], key };
}

/* ════════════════════════════
   EXTRACT ANSWERS FROM HISTORY
════════════════════════════ */
function extractAnswers() {
  const userMsgs = S.history.filter(m => m.role === 'user').map(m => m.content);
  S.answers = {
    status: userMsgs[0] || '',
    important: userMsgs[1] || '',
    blocker: userMsgs[2] || '',
    improve: userMsgs[3] || '',
    comfort: (userMsgs[4] || '5').match(/\d+/)?.[0] || '5'
  };
}

function shortenAnswer(text, max, lang) {
  if (!text) return lang === 'he' ? 'לא צוין' : 'Not specified';
  return text.length > max ? text.slice(0, max) + '...' : text;
}

function startCoaching() {

function setInputDisabled(val) {
  S.isTyping = val;
  document.getElementById('input-box').disabled = val;
  document.getElementById('send-btn').disabled = val;
  if (!val) document.getElementById('input-box').placeholder = T[S.lang].inputPh;
  else document.getElementById('input-box').placeholder = S.lang === 'he' ? 'המאמן מקליד... ✍️' : 'Coach is typing...';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function sendMessage() {
  const box = document.getElementById('input-box');
  const text = box.value.trim();
  if (!text || S.isTyping) return;

  box.value = '';
  box.style.height = 'auto';
  removeChips();

  await addMsg(text, 'user');
  await callClaude(text);
}

  const btn = document.querySelector('.btn-google');
  btn.disabled = true;
  document.getElementById('google-btn-txt').textContent = S.lang === 'he' ? 'מחבר...' : 'Connecting...';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if (error) {
    showAuthError(S.lang === 'he' ? 'שגיאה בכניסה עם Google' : 'Google sign-in error');
    btn.disabled = false;
    document.getElementById('google-btn-txt').textContent = S.lang === 'he' ? 'המשך עם Google' : 'Continue with Google';
  }
}

async function emailAuth() {
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn      = document.getElementById('btn-email');
  const isHe     = S.lang === 'he';

  if (!email.includes('@') || password.length < 6) {
    showAuthError(isHe ? 'אימייל לא תקין או סיסמא קצרה מדי (6+ תווים)' : 'Invalid email or password too short (6+ chars)');
    return;
  }

  btn.disabled = true;
  document.getElementById('email-btn-txt').textContent = isHe ? 'טוען...' : 'Loading...';

  if (!sb) { demoSkipAuth(email); return; }

  if (authMode === 'register') {
    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      showAuthError(isHe ? 'שגיאה: ' + error.message : 'Error: ' + error.message);
      btn.disabled = false;
      document.getElementById('email-btn-txt').textContent = isHe ? 'צור חשבון' : 'Create Account';
      return;
    }
    // Auto sign-in after register
    await sb.auth.signInWithPassword({ email, password });
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      // If user doesn't exist, auto-register
      if (error.message.includes('Invalid login')) {
        showAuthError(isHe ? 'אימייל או סיסמא שגויים' : 'Wrong email or password');
      } else {
        showAuthError(isHe ? 'שגיאה: ' + error.message : 'Error: ' + error.message);
      }
      btn.disabled = false;
      document.getElementById('email-btn-txt').textContent = isHe ? 'כניסה / הרשמה' : 'Sign In / Sign Up';
      return;
    }
  }
  // onAuthStateChange will fire and handle the rest
}

function demoSkipAuth(email) {
  // No Supabase – just continue as guest
  hideAuthAndStart(email || 'guest@demo.com');
}

async function saveConversation() {
  if (!sb || !currentUser) return;
  try {
    await sb.from('conversations').upsert({
      user_id: currentUser.id,
      messages: S.history,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  } catch(e) { console.warn('Save error', e); }
}

async function loadConversation() {
  if (!sb || !currentUser) return null;
  try {
    const { data } = await sb.from('conversations')
      .select('messages').eq('user_id', currentUser.id).single();
    return data?.messages || null;
  } catch(e) { return null; }
}

async function saveOnboarding() {
  if (!sb || !currentUser) return;
  const a = S.answers;
  try {
    await sb.from('onboarding').upsert({
      user_id: currentUser.id,
      status: a.status, important: a.important,
      blocker: a.blocker, improve: a.improve,
      comfort: parseInt(a.comfort) || null,
      completed_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  } catch(e) { console.warn('Onboarding save error', e); }
}

function showUserBadge(email) {
  const badge = document.getElementById('user-badge');
  badge.style.display = 'flex';
  document.getElementById('user-email-short').textContent = email.split('@')[0];
}

async function signOut() {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  document.getElementById('user-badge').style.display = 'none';
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('btn-email').disabled = false;
  document.getElementById('email-btn-txt').textContent = S.lang === 'he' ? 'כניסה / הרשמה' : 'Sign In / Sign Up';
  document.getElementById('auth-error').style.display = 'none';
}

function hideAuthAndStart(email) {
  document.getElementById('auth-overlay').style.display = 'none';
  if (email) showUserBadge(email);
  startChat();
}

// Wrap triggerSignup to save onboarding data
const _origTriggerSignup = triggerSignup;
triggerSignup = async function() {
  await saveOnboarding();
  await _origTriggerSignup();
};

// Save after each coach reply
const _origCallClaude = callClaude;
callClaude = async function(msg) {
  await _origCallClaude(msg);
  saveConversation(); // fire and forget
};

/* ════════════════════════════
   INIT
════════════════════════════ */
async function startChat() {
  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') === 'en' ? 'en' : 'he';
  setLang(lang);

  // Check for saved conversation
  const saved = await loadConversation();
  if (saved && saved.length > 0) {
    // Restore previous session
    S.history = saved;
    for (const m of saved) {
      const key = m._msgKey || null;
      await addMsg(m.content, m.role === 'user' ? 'user' : 'coach', 0, key);
    }
    setInputDisabled(false);
    document.getElementById('input-box').focus();
    return;
  }

  // Fresh start
  await new Promise(r => setTimeout(r, 400));
  showTyping();
  await new Promise(r => setTimeout(r, 1200));
  hideTyping();
  await addMsg(T[lang].openingMsg, 'coach', 0, 'openingMsg');
  document.getElementById('input-box').focus();
}

async function init() {
  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') === 'en' ? 'en' : 'he';
  setLang(lang);

  await initSupabase();

  if (!sb) {
    // No Supabase – skip auth overlay
    document.getElementById('auth-overlay').style.display = 'none';
    startChat();
    return;
  }

  // Listen for auth changes (Google OAuth callback / email login)
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user && !currentUser) {
      currentUser = session.user;
      hideAuthAndStart(session.user.email);
    }
  });

  // Already logged in?
  const { data } = await sb.auth.getSession();
  if (data?.session?.user) {
    currentUser = data.session.user;
    hideAuthAndStart(currentUser.email);
  }
  // Otherwise auth overlay stays visible
}

init();
</script>
